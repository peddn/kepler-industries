[package]
name = "game"
version = "0.1.0"
edition = "2024"

[dependencies]
sim = { path = "../sim" }
# Nur die benötigten Teile von Bevy: 3D-Rendering, Gizmos, UI-Text, Fenster.
# Kein Audio, kein Gamepad (spart Systembibliotheken und Kompilierzeit).
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "wayland",
    "default_font",
    "3d_bevy_render",
    "ui_api",
    "ui_bevy_render",
    "png",
] }
# Oberfläche: Fenster, Schaltflächen, Regler, Textfelder. Ohne Zwischenablage
# und Browser (sparen Systembibliotheken).
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
