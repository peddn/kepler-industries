# Prüft jeden Pull Request und jeden Stand von main: Formatierung, Clippy
# ohne Warnungen und alle Tests. Die Simulation läuft zuerst und allein, weil
# sie ohne Bevy in Sekunden baut; das Spiel braucht die Bibliotheken für
# Fenster und Grafik und deutlich länger.
name: Prüfung

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  simulation:
    name: Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: sim
      - name: Formatierung
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p sim --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p sim

  spiel:
    name: Spiel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bibliotheken für Fenster und Grafik
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwayland-dev libxkbcommon-dev libudev-dev libx11-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: spiel
      - name: Clippy
        run: cargo clippy -p game --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p game
